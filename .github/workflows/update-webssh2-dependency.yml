name: Update webssh2 dependency

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to update to (leave empty to use latest)'
        required: false
        type: string

# No default token scopes; each job declares what it needs.
permissions: {}

jobs:
  update-dependency:
    name: Update webssh2_client in webssh2
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the update branch
      pull-requests: write # open the update PR
    steps:
      - name: Checkout webssh2_client
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          repository: billchurch/webssh2_client
          path: webssh2_client
          persist-credentials: false

      - name: Checkout webssh2
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          repository: billchurch/webssh2
          token: ${{ secrets.GITHUB_TOKEN }}
          path: webssh2
          # create-pull-request sets up its own credentials from `token`.
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Get webssh2_client version
        id: get-version
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ "$EVENT_NAME" = "release" ]; then
            VERSION="$RELEASE_TAG"
          elif [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
          else
            # Fall back to the version in webssh2_client's package.json
            VERSION=$(node -p "require('./webssh2_client/package.json').version")
          fi
          VERSION="${VERSION#v}"  # Remove 'v' prefix if present
          # The version ends up in a branch name, a commit message and the
          # PR title, so accept only a SemVer string (X.Y.Z with optional
          # -prerelease and +build identifiers).
          SEMVER='^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          if [[ ! "$VERSION" =~ $SEMVER ]]; then
            echo "::error::'${VERSION}' is not a version (expected X.Y.Z[-pre][+build])"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Using webssh2_client version: $VERSION"

      - name: Update webssh2 package.json
        working-directory: webssh2
        env:
          VERSION: ${{ steps.get-version.outputs.version }}
        run: |
          # Update the webssh2_client dependency version
          npm pkg set "dependencies.webssh2_client=^${VERSION}"
          
          # Run npm install to update package-lock.json
          npm install --ignore-scripts

      - name: Check for changes
        id: check-changes
        working-directory: webssh2
        run: |
          if git diff --quiet package.json package-lock.json; then
            echo "No changes detected"
            echo "has-changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "Changes detected"
            echo "has-changes=true" >> "$GITHUB_OUTPUT"
            git diff package.json
          fi

      - name: Create Pull Request
        if: steps.check-changes.outputs.has-changes == 'true'
        # Keeps branch reuse, signed commits, labels and assignees in one
        # step; a gh pr create script would have to re-implement them.
        uses: peter-evans/create-pull-request@84ae59a2cdc2258d6fa0732dd66352dddae2a412 # v7.0.9 # zizmor: ignore[superfluous-actions]
        with:
          path: webssh2
          token: ${{ secrets.GITHUB_TOKEN }}
          sign-commits: true
          commit-message: |
            chore: update webssh2_client to v${{ steps.get-version.outputs.version }}
            
            Updates webssh2_client dependency to version ${{ steps.get-version.outputs.version }}
          branch: update-webssh2-client-${{ steps.get-version.outputs.version }}
          delete-branch: true
          title: 'chore: update webssh2_client to v${{ steps.get-version.outputs.version }}'
          body: |
            ## 🔄 Dependency Update
            
            This PR updates the `webssh2_client` dependency to version **${{ steps.get-version.outputs.version }}**.
            
            ### Changes
            - Updated `webssh2_client` in package.json
            - Updated package-lock.json
            
            ### Release Notes
            ${{ github.event_name == 'release' && github.event.release.body || 'Manual update triggered via workflow dispatch.' }}
            
            ---
            *This PR was automatically created by the update-webssh2-dependency workflow.*
          labels: |
            dependencies
            automated
          assignees: billchurch