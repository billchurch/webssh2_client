name: Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Release Please
        id: release
        uses: googleapis/release-please-action@16a9c90856f42705d54a6fda1823352bdc62cf38 # v4.4.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    name: Build client
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tag
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build client
        run: npm run build

      - name: Build server entries
        run: npm run build:server

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: build-output
          path: |
            client/public/
            dist/
          retention-days: 1

  attach-assets:
    name: Attach assets to release
    needs: [release-please, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: build-output

      - name: Create client-public.zip
        run: |
          cd client/public
          zip -r ../../client-public.zip .
          cd -

      - name: Generate checksums
        env:
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: |
          {
            echo "# webssh2_client ${TAG_NAME} SHA-256 checksums"
            sha256sum client-public.zip
            cd client && find public -type f | LC_ALL=C sort | xargs sha256sum
          } > checksums.txt
          cat checksums.txt
          {
            echo '## Artifact checksums (SHA-256)'
            echo ''
            echo 'Per-file hashes of the shipped browser bundle. Verify against'
            echo 'the npm-installed package or the attached zip; see SECURITY'
            echo 'docs ("Release artifact integrity") for how.'
            echo ''
            echo '```text'
            cat checksums.txt
            echo '```'
          } > checksums-notes.md

      # Sigstore-signed provenance for the release assets. Makes
      # checksums.txt tamper-evident (release assets are otherwise mutable
      # with repo write access); verify with:
      #   gh attestation verify checksums.txt --repo billchurch/webssh2_client
      - name: Attest release artifacts
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: |
            client-public.zip
            checksums.txt

      - name: Attach assets to release
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b # v2.5.0
        with:
          tag_name: ${{ needs.release-please.outputs.tag_name }}
          files: |
            client-public.zip
            checksums.txt
          append_body: true
          body_path: checksums-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-npm:
    name: Publish to npm
    needs: [release-please, build]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout tag
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org/'

      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: build-output

      - name: Determine npm tag
        id: npm-tag
        run: |
          # Extract version from package.json
          VERSION=$(node -p "require('./package.json').version")
          echo "Version: $VERSION"

          # Check if it's a prerelease version (contains alpha, beta, rc, etc.)
          if [[ "$VERSION" =~ (alpha|beta|rc|pre) ]]; then
            echo "NPM_TAG=alpha" >> $GITHUB_OUTPUT
            echo "Publishing as alpha tag"
          else
            echo "NPM_TAG=latest" >> $GITHUB_OUTPUT
            echo "Publishing as latest tag"
          fi

      - name: Publish to npm
        run: npm publish --provenance --access public --tag ${{ steps.npm-tag.outputs.NPM_TAG }}
