name: Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      backfill_tag:
        description: >-
          Existing release tag to rebuild and re-attach assets for
          (e.g. v5.1.0). Leave empty for a normal release-please run.
        required: false
        type: string
        default: ''

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Release Please
        id: release
        # Skipped in backfill mode so a pending release PR can't be
        # released as a side effect of re-attaching old assets.
        if: ${{ !inputs.backfill_tag }}
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    name: Build client
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true' || inputs.backfill_tag != ''
    runs-on: ubuntu-latest
    steps:
      - name: Validate backfill tag
        if: inputs.backfill_tag != ''
        env:
          BACKFILL_TAG: ${{ inputs.backfill_tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ ! "$BACKFILL_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::backfill_tag '${BACKFILL_TAG}' is not a release tag (expected vX.Y.Z)"
            exit 1
          fi
          # Require an existing release: action-gh-release would otherwise
          # create a brand-new release for an arbitrary tag.
          gh release view "$BACKFILL_TAG" --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName

      - name: Checkout tag
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ inputs.backfill_tag || needs.release-please.outputs.tag_name }}

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build client
        run: npm run build

      - name: Build server entries
        run: npm run build:server

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-output
          path: |
            client/public/
            dist/
          retention-days: 1

  attach-assets:
    name: Attach assets to release
    needs: [release-please, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-output

      - name: Create client-public.zip
        run: |
          cd client/public
          zip -r ../../client-public.zip .
          cd -

      - name: Generate checksums
        env:
          TAG_NAME: ${{ inputs.backfill_tag || needs.release-please.outputs.tag_name }}
        run: |
          {
            echo "# webssh2_client ${TAG_NAME} SHA-256 checksums"
            sha256sum client-public.zip
            (cd client && find public -type f | LC_ALL=C sort | xargs sha256sum)
          } > checksums.txt
          cat checksums.txt
          {
            echo '## Artifact checksums (SHA-256)'
            echo ''
            echo 'Per-file hashes of the shipped browser bundle. Verify against'
            echo 'the npm-installed package or the attached zip; see SECURITY'
            echo 'docs ("Release artifact integrity") for how.'
            echo ''
            echo '```text'
            cat checksums.txt
            echo '```'
          } > checksums-notes.md

      # Sigstore-signed provenance for the release assets. Makes
      # checksums.txt tamper-evident (release assets are otherwise mutable
      # with repo write access); verify with:
      #   gh attestation verify checksums.txt --repo billchurch/webssh2_client
      - name: Attest release artifacts
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: |
            client-public.zip
            checksums.txt

      - name: Attach assets to release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          tag_name: ${{ inputs.backfill_tag || needs.release-please.outputs.tag_name }}
          files: |
            client-public.zip
            checksums.txt
          append_body: true
          body_path: checksums-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-npm:
    name: Publish to npm
    needs: [release-please, build]
    # Never republish during an asset backfill; only run for a release
    # that release-please created in this run.
    if: needs.release-please.outputs.release_created == 'true' && !inputs.backfill_tag
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout tag
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org/'

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-output

      - name: Determine npm tag
        id: npm-tag
        run: |
          # Extract version from package.json
          VERSION=$(node -p "require('./package.json').version")
          echo "Version: $VERSION"

          # Check if it's a prerelease version (contains alpha, beta, rc, etc.)
          if [[ "$VERSION" =~ (alpha|beta|rc|pre) ]]; then
            echo "NPM_TAG=alpha" >> $GITHUB_OUTPUT
            echo "Publishing as alpha tag"
          else
            echo "NPM_TAG=latest" >> $GITHUB_OUTPUT
            echo "Publishing as latest tag"
          fi

      - name: Publish to npm
        run: npm publish --provenance --access public --tag ${{ steps.npm-tag.outputs.NPM_TAG }}
